name: Smart Lifting Optimizer CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  unit-and-build:
    name: Unit Tests & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend Jest unit tests
        working-directory: backend
        env:
          JWT_SECRET: ci-unit-test-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_lifting_test
          NODE_ENV: test
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Verify frontend production build
        working-directory: frontend
        run: npm run build

  e2e-api-tests:
    name: Full E2E API Suite (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: unit-and-build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: smart_lifting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/smart_lifting_ci
      JWT_SECRET: ci-e2e-super-secret-jwt-key
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply PostgreSQL schema and seed 60+ exercises
        working-directory: backend
        run: node migrate.js

      - name: Start Express server & run 57-check E2E API test suite
        working-directory: backend
        run: |
          node src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "Backend is healthy!"
              break
            fi
            sleep 1
          done
          npm run test:api
          kill $SERVER_PID || true
